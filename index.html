    <script>
// An installed app can stay open between releases. Check again when it returns
// to the foreground, as well as on the first load and when connectivity returns.
(() => {
  if (!('serviceWorker' in navigator)) return;

  let registration;
  let checking = false;
  let lastCheck = 0;

  async function checkForUpdate(force = false) {
    if (!registration || checking || document.visibilityState === 'hidden') return;
    if (!force && Date.now() - lastCheck < 60000) return;
    checking = true;
    lastCheck = Date.now();
    try {
      await registration.update();
    } catch {
      // Keep the existing version usable when the device is offline.
    } finally {
      checking = false;
    }
  }

  async function register() {
    try {
      registration = await navigator.serviceWorker.register('/investly-app/sw.js', {
        updateViaCache: 'none',
      });
      await checkForUpdate(true);
    } catch {
      // The online app also works in browsers without service worker support.
    }
  }

  window.addEventListener('pageshow', () => checkForUpdate());
  window.addEventListener('focus', () => checkForUpdate());
  window.addEventListener('online', () => checkForUpdate(true));
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') checkForUpdate();
  });
  if (document.readyState === 'complete') register();
  else window.addEventListener('load', register, { once: true });
})();
    </script>
