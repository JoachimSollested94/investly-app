<!doctype html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1A7F5A" />
    <meta name="description" content="En rolig, trygt guidet vej fra nul til din første investering." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Investly" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet" />
    <title>Investly</title>
    <script>
      /* Appen er mørk. Sæt tema + soft-UI-skin FØR første tegning, så siden
         ikke når at blinke i et andet look, før React mounter. */
      (function () {
        var root = document.documentElement;
        root.setAttribute('data-theme', 'dark');
        root.setAttribute('data-skin', 'neu-dark');
      })();
    </script>
    <script type="module" crossorigin src="./assets/index-mrqscMIb.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-DiKJtSlU.css">
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Registrer service worker → appen virker offline og opdaterer rent
      // (network-first + versioneret cache i sw.js).
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
